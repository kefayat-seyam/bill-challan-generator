<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bill & Challan Generator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Bill & Challan Generator</div>
    <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle theme">Dark</button>
  </header>

  <main class="landing">
    <section class="landing-grid">
      <button class="mode-card" id="unityCard" type="button">
        <span class="mode-logo"><img src="assets/logo.png" alt="Unity Trading International"></span>
        <strong>Unity Trading International</strong>
        <span>Bill and challan</span>
      </button>
      <button class="mode-card" id="otherCard" type="button">
        <span class="mode-icon">O</span>
        <strong>Other Companies</strong>
        <span>Bill and challan</span>
      </button>
    </section>

    <section class="pinned-section">
      <h2>Pinned companies</h2>
      <div id="pinnedCompanies" class="pin-row"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
